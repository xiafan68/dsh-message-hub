<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 消息订阅</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20352d; background: #f3f7f4; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; }
    main { box-sizing: border-box; width: min(420px, calc(100% - 32px)); padding: 32px; border: 1px solid #dce7e0; border-radius: 18px; background: #fff; box-shadow: 0 16px 40px #26463814; }
    h1 { margin: 0 0 8px; font-size: 24px; } p { margin: 0 0 24px; color: #718078; line-height: 1.6; }
    label { display: grid; gap: 8px; color: #52665d; font-size: 14px; } input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbdad1; border-radius: 10px; font: inherit; }
    button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px; color: #fff; background: #29725b; font: inherit; cursor: pointer; } button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 22px; margin-top: 14px; color: #b14f42; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>登录消息订阅</h1>
    <p>请输入管理 Token 以继续访问控制台。</p>
    <form id="login-form"><label for="token">管理 Token<input id="token" type="password" autocomplete="current-password" required autofocus></label><button type="submit">登录</button></form>
    <div id="message" role="alert"></div>
  </main>
  <script>
    const form = document.querySelector("#login-form");
    const input = document.querySelector("#token");
    const message = document.querySelector("#message");
    input.value = localStorage.getItem("messageSubscriptionsToken") || "";
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const token = input.value.trim();
      const button = form.querySelector("button");
      button.disabled = true; message.textContent = "";
      try {
        const response = await fetch("/api/v1/auth/session", { headers: { Accept: "application/json", Authorization: `Bearer ${token}` } });
        if (!response.ok) throw new Error(response.status === 401 ? "请输入 Token" : "Token 无效");
        localStorage.setItem("messageSubscriptionsToken", token);
        const next = new URLSearchParams(window.location.search).get("next") || "/ui";
        window.location.assign(next.startsWith("/") && !next.startsWith("//") ? next : "/ui");
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
  </script>
</body>
</html>
