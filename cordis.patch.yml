# @dsh-external/dsh-message-hub bundle 层
#
# 把本包作为 profile 的一层装配：profile 的 `dsh.profile.bundles` 里加入本包后，
# 装配时插入下面这一行（id 稳定，便于用 profile 的 cordis.patch.yml 覆盖 config）。
#
# 注意：与注入式装配（dsh-super-injector 等）二选一，否则会有两个 fiber 重复注册
# 同名工具与同名面板。
- insert:
    - id: dsh-message-hub
      name: '@dsh-external/dsh-message-hub'
      config:
        # 内置引擎的监听地址。面板、BFF、hub_* 工具都连这里。
        apiBase: 'http://127.0.0.1:4001'
        # 写接口的 Bearer Token（内置引擎默认不校验）。留空则读 tokenFile。
        token: ''
        tokenFile: '~/.config/message-subscriptions/api-token'
        # 引擎代码目录；留空 = 本包自带的 service/。
        serviceDir: ''
        # venv / 安装日志 / service.log 的落点；留空 = ~/.dsh/message-hub/runtime。
        runtimeDir: ''
        # 数据目录（subscriptions.db）；留空 = ~/.dsh/message-hub/data。
        dataDir: ''
        # 指定 Python 解释器；留空 = 宿主自带的 Python，再退回 PATH。
        pythonPath: ''
        # 首次启动时用 pip 安装引擎依赖（fastapi/uvicorn/httpx/bs4/PyYAML）。
        installDeps: true
        # 是否允许面板「启动服务」/ hub_service_start 拉起引擎。
        autoStart: true
        # 面板一屏抓多少条条目。
        defaultLimit: 50